name: Ubuntu X86_64

on: [push, pull_request]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        variant: [release, asan-ubsan, tsan, tsan-gcc]

    runs-on: ubuntu-latest

    env:
      TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1:history_size=7

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y libgtest-dev libgmock-dev libbenchmark-dev cmake clang-18 g++-14

    - name: Setup CMake and Ninja
      uses: lukka/get-cmake@v4.2.0

    - name: Check compiler versions
      run: |
        g++-14 --version
        clang++-18 --version
        echo "=== clang selected GCC / libstdc++ ==="
        clang++-18 -v -std=c++23 -fsyntax-only -x c++ /dev/null 2>&1 | grep -i "selected gcc" || true
        echo "g++-14 install dir: $(dirname $(g++-14 -print-libgcc-file-name))"
        echo "=== std::expected probe (clang default libstdc++ selection) ==="
        printf '#include <expected>\nstd::expected<int,int> e;\n' | clang++-18 -std=c++23 -x c++ -fsyntax-only - && echo "OK: default stdlib sees std::expected" || echo "WARN: default stdlib does NOT see std::expected"
        echo "=== std::expected probe (pinned to g++-14 libstdc++) ==="
        printf '#include <expected>\nstd::expected<int,int> e;\n' | clang++-18 -std=c++23 --gcc-install-dir=$(dirname $(g++-14 -print-libgcc-file-name)) -x c++ -fsyntax-only - && echo "OK: pinned g++-14 stdlib sees std::expected" || echo "WARN: pinned g++-14 stdlib does NOT see std::expected"
        echo "=== feature macros (default selection) ==="
        clang++-18 -std=c++23 -dM -E -x c++ /dev/null | grep -E '__cplusplus|__cpp_concepts|__GLIBCXX__' || true

    - name: Create build directory
      run: mkdir build

    - name: Configure CMake (Release)
      if: matrix.variant == 'release'
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

    - name: Configure CMake (ASAN/UBSAN)
      if: matrix.variant == 'asan-ubsan'
      run: >
        cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
        -DBUILD_HAZARDSYSTEM_BENCHMARK=OFF -DBUILD_HAZARDSYSTEM_EXAMPLE=OFF
        -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer'
        -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined'

    - name: Configure CMake (TSAN, Clang)
      if: matrix.variant == 'tsan'
      run: >
        cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
        -DBUILD_HAZARDSYSTEM_BENCHMARK=OFF -DBUILD_HAZARDSYSTEM_EXAMPLE=OFF
        -DCMAKE_CXX_COMPILER=clang++-18 -DCMAKE_C_COMPILER=clang-18
        -DCMAKE_CXX_FLAGS="-std=c++23 --gcc-install-dir=$(dirname $(g++-14 -print-libgcc-file-name)) -fsanitize=thread -fno-omit-frame-pointer -O1"
        -DCMAKE_EXE_LINKER_FLAGS="--gcc-install-dir=$(dirname $(g++-14 -print-libgcc-file-name)) -fsanitize=thread"

    - name: Configure CMake (TSAN, GCC)
      if: matrix.variant == 'tsan-gcc'
      run: >
        cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
        -DBUILD_HAZARDSYSTEM_BENCHMARK=OFF -DBUILD_HAZARDSYSTEM_EXAMPLE=OFF
        -DCMAKE_CXX_COMPILER=g++-14 -DCMAKE_C_COMPILER=gcc-14
        -DCMAKE_CXX_FLAGS='-fsanitize=thread -fno-omit-frame-pointer -O1'
        -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=thread'

    - name: Build
      run: cmake --build build

    - name: Probe hazard protect path first
      working-directory: build
      run: ctest -R HazardSystem_HazardPointer_Protect_Probe --output-on-failure

    - name: Test (no benchmarks, TSan with repeat)
      if: startsWith(matrix.variant, 'tsan')
      working-directory: build
      run: ctest -LE benchmark --output-on-failure --repeat until-fail:3

    - name: Test (no benchmarks)
      if: ${{ !startsWith(matrix.variant, 'tsan') }}
      working-directory: build
      run: ctest -LE benchmark --output-on-failure

    - name: Stress tests (repeat suite)
      if: matrix.variant == 'release'
      working-directory: build
      run: ctest -LE benchmark --output-on-failure --repeat until-fail:20

    - name: Run Static HazardSystem Benchmarks
      if: matrix.variant == 'release'
      run: ./build/benchmarkbin/HazardSystem_Fixed_Benchmark
  
    - name: Run Dynamic HazardSystem Benchmarks
      if: matrix.variant == 'release'
      run: ./build/benchmarkbin/HazardSystem_Dynamic_Benchmark
    
    - name: Run Static Bitmask Benchmarks
      if: matrix.variant == 'release'
      run: ./build/benchmarkbin/HazardSystem_BitmaskTable_Fixed_Benchmark

    - name: Run Dynamic Bitmask Benchmarks
      if: matrix.variant == 'release'
      run: ./build/benchmarkbin/HazardSystem_BitmaskTable_Dynamic_Benchmark

    - name: Run HashSet Benchmarks
      if: matrix.variant == 'release'
      run: ./build/benchmarkbin/HazardSystem_HashSet_Benchmark

    - name: Run Protected Pointer Benchmarks
      if: matrix.variant == 'release'
      run: ./build/benchmarkbin/HazardSystem_ProtectedPointer_Benchmark

    - name: Run Hazard Registry Benchmarks
      if: matrix.variant == 'release'
      run: ./build/benchmarkbin/HazardSystem_HazardRegistry_Benchmark
